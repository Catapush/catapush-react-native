plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.catapush.reactnative.sdk'
    compileSdkVersion safeExtGet('compileSdkVersion', 36)
    buildToolsVersion safeExtGet('buildToolsVersion', '36.0.0')

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url("$rootDir/../../example/node_modules/react-native/android")
    }
    mavenCentral {
        content {
            excludeGroup "com.facebook.react"
        }
    }
    google()
    maven { url "https://s3.eu-west-1.amazonaws.com/m2repository.catapush.com/" }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'

    api "com.catapush.catapush-android-sdk:core:16.0.0"
    api "com.catapush.catapush-android-sdk:gms:16.0.0"
}
